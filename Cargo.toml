[package]
name = "music-theory-rs"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[lib]
name = "music_theory_rs"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "music-theory-rs-desktop"
path = "src/main.rs"

[dependencies]
rodio = "0.23.0"
slint = { version = "1.18.1", features = ["backend-android-activity-06"] }

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = { version = "0.2" }
js-sys = { version = "0.3" }
slint = { version = "1.18.1", features = ["backend-winit", "renderer-femtovg"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
rodio = { version = "0.23.0", features = ["wasm-bindgen"] }

[build-dependencies]
slint-build = "1.18.1"

[profile.release]
codegen-units = 1
lto = true

[package.metadata.android]
package = "com.eduhoff.musictheoryrs"
apk_name = "MusicTheoryRS"
resources = "res"

[package.metadata.android.application]
label = "Music Theory"
icon = "@drawable/ic_launcher"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35

[[package.metadata.android.application.activity]]
name = "android.app.NativeActivity"

[[package.metadata.android.application.activity.meta_data]]
name = "android.app.lib_name"
value = "music_theory_rs"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.VIEW", "android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]
