<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Music Theory RS</title>
        <style>
            html,
            body {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                background-color: #18181b;
                display: flex;
                justify-content: center;
                align-items: center;
                overflow: hidden;
            }
            canvas {
                outline: none;
                width: 900px;
                height: 600px;
                max-width: 100%;
                max-height: 100%;
            }
        </style>
    </head>
    <body>
        <canvas id="canvas"></canvas>
        <script type="module">
            import init from "./pkg/music_theory_rs.js";
            async function main() {
                try {
                    await init();
                    console.log("Slint Wasm initialized successfully!");
                } catch (err) {
                    console.error("Critical error loading Wasm:", err);
                }
            }
            window.addEventListener("load", main);
        </script>
    </body>
</html>
